<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Watch Bitcoin's BIP-110 / RDTS soft-fork race unfold live. Forkwatch tracks Core and Knots block-for-block and renders any chain split as an isometric chain you can scroll through in real time."
    />

    <!-- Open Graph / Twitter. The card art is generated by scripts/og-image/render.sh from the app's
         own crest, cube geometry, segment digits and stickers. TODO: og:url + absolute image URLs
         once a public domain is set — Facebook's scraper will not resolve a relative og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forkwatch" />
    <meta property="og:title" content="Forkwatch — Live BIP-110 / RDTS Fork Tracker" />
    <meta
      property="og:description"
      content="Watch Bitcoin's BIP-110 / RDTS soft-fork race unfold live. Forkwatch tracks Core and Knots block-for-block and renders any chain split as an isometric chain you can scroll through in real time."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Forkwatch crest and wordmark above a seven-segment countdown to the fork, beside an isometric Bitcoin chain that splits at its last common block into two lanes — Core's in the brand emerald, the orphaned Knots branch greyed out."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forkwatch — Live BIP-110 / RDTS Fork Tracker" />
    <meta
      name="twitter:description"
      content="Watch Bitcoin's BIP-110 / RDTS soft-fork race unfold live. Forkwatch tracks Core and Knots block-for-block and renders any chain split as an isometric chain you can scroll through in real time."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Forkwatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
