# Bitcoin Knots v29.3.knots20260508 — regtest (Forkwars e2e).
# Knots is the RDTS-ENFORCING side. `consensusrules=rdts` opts this node into the
# BIP-110/RDTS ruleset non-interactively (headless equivalent of the GUI confirm prompt).
regtest=1
server=1
daemon=0
printtoconsole=1
txindex=1

# Both of these default to ON for regtest (chainparams sets DefaultConsistencyChecks() = true) and
# both are pure debug assertions — they do not affect consensus, only how much self-checking the
# node does per block.
#
# checkblockindex is the expensive one: it walks the ENTIRE block index on every ActivateBestChain,
# i.e. O(height) work per block and O(height^2) over a build. Both nodes pay it; Knots is simply the
# one that falls over first, so it presents as "Knots cannot keep up with Core".
#
# Measured on this chain, syncing Knots: 120 blk/s around height 25k, 47 at 100k, 16 at 200k and
# still falling — extrapolating to ~34 hours for the 927k-block bulk phase. Restarting Knots with
# this one line, same chain, same height: 16 -> 249 blk/s. End to end the reset's bulk phase went
# from 49 blk/s (falling) to ~1900 blk/s (rising) at the 100k mark — hours to minutes.
checkblockindex=0
checkmempool=0

# Enable RDTS enforcement on this node.
consensusrules=rdts

# RPC credentials: entrypoint writes /data/rpc.conf (0600) with an rpcauth salted hash derived from
# RPC_USER/RPC_PASS, so no password reaches a command line. Global scope is required — bitcoind
# rejects includeconf inside a network section.
includeconf=rpc.conf

[regtest]
# RPC auth comes from the rpcauth hash in the includeconf'd rpc.conf above, never from this file.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18443
port=18444
bind=0.0.0.0
listen=1
zmqpubhashblock=tcp://0.0.0.0:28332
fallbackfee=0.0002

# Activate the RDTS ("reduced_data", bit 4) deployment on regtest: start now, no timeout.
# Default regtest chainparams set it NEVER_ACTIVE, so we override to drive it to ACTIVE via
# signaling. (regtest-only; Core has no such deployment.)
vbparams=reduced_data:0:9223372036854775807

# Peer directly to Core so this node sees Core's blocks and can mark violating ones invalid.
addnode=core:18444
