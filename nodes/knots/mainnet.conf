# Bitcoin Knots v29.3.knots20260508 — MAINNET (Forkwars). Pruned, blocks-only. Tor for P2P ONLY.
# Knots is the RDTS-enforcing side. consensusrules=rdts opts into BIP-110 enforcement (headless).
# NOTE: no vbparams here — mainnet chainparams already schedule RDTS (start ~Dec 2025, active 965664).
server=1
daemon=0
printtoconsole=1
prune=150000
blocksonly=1
txindex=0

# --- Host tuning: dbcache / onlynet / dnsseed are NOT set in this file ---------------------------
# They vary per deployment (box RAM; Tor vs clearnet sync), so the entrypoint generates
# /data/local.conf from FW_NODE_DBCACHE / FW_NODE_ONLYNET / FW_NODE_DNSSEED in compose/.env — the
# same split used for the RPC hash below. Defaults reproduce this file's original posture:
# dbcache=450, onlynet=onion, dnsseed=0. Keeping them out of git is what lets a server hold its own
# tuning without a dirty working tree.
#
# DO NOT add them back here. onlynet is a MULTI-VALUE option: a value in this file plus one in the
# include would UNION the networks (onion + ipv4) rather than override, silently putting block
# download back on Tor — measured at ~4000x slower than clearnet during IBD. Exactly one definition
# of each key must exist.
#
# Sizing note that used to live on dbcache: the UTXO cache is the dominant driver of this node's RSS,
# so it has to agree with the container's mem_limit (FW_NODE_MEM_LIMIT) — 450 MiB pairs with ~5g, 300
# with an 8 GB box, 1000 with 32 GB. It is also the single biggest IBD lever, because a cache large
# enough to hold the working UTXO set stops every block from paying for random reads back off disk.
includeconf=local.conf

# RPC credentials. The entrypoint writes /data/rpc.conf (mode 0600) at startup holding an rpcauth
# SALTED HASH derived from RPC_USER/RPC_PASS, so no secret is committed here and no password ever
# reaches a command line (host `ps aux` would show it). Must stay at global scope: bitcoind rejects
# includeconf inside a network section. The file always exists — the entrypoint creates it, empty
# when no credentials are supplied, in which case bitcoind uses cookie auth alone.
includeconf=rpc.conf

consensusrules=rdts

# --- P2P transport; direct clearnet ONLY for the internal Core<->Knots peer link. ---
# Use onion= (not proxy=) so Tor proxies onion addrs but ipv4 stays direct — that lets the addnode
# below reach the peer container over fwnet. WHICH networks get dialed is decided by onlynet in
# local.conf (see above), not here: onlynet=onion bars every *automatic* clearnet dial, so no public
# leak is possible; onlynet=ipv4 syncs over clearnet instead, which exposes this node's IP to the
# peers it dials — the web origin stays hidden behind the Cloudflare tunnel either way. Manual
# addnode connections are exempt from onlynet by design, so the Core<->Knots link holds regardless.
# dnsseed lives in local.conf for the same reason: seeds are how clearnet peers are discovered, and
# pointless under onlynet=onion. listen=1 accepts the peer's inbound on fwnet (8333 is not published
# to the host); listenonion=0 avoids an inbound hidden service (we have no Tor control port).
onion=tor:9050
listen=1
listenonion=0

[main]
# RPC auth comes from the rpcauth hash in the includeconf'd rpc.conf above, never from this file.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=8332
zmqpubhashblock=tcp://0.0.0.0:28332
# Direct local peer link to Core so neither node can lag behind the other on Tor luck (a lagging
# node would render as a false fork). Manual peer → exempt from onlynet, connects direct over fwnet.
addnode=core:8333
